name: Promote main to production

on:
  workflow_dispatch:
    inputs:
      version_bump:
        description: "Version increment"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

permissions:
  contents: write

jobs:
  test:
    uses: ./.github/workflows/pytest.yml
  prek:
    uses: ./.github/workflows/prek.yml
  release:
    needs:
      - prek
      - test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install uv and setup python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          # Install a specific version of uv.
          version: "0.12.1"
          python-version: 3.14
          enable-cache: true

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Bump version
        id: bump
        run: |
          python <<'EOF'
          from pathlib import Path
          import os
          import re

          bump = os.environ["VERSION_BUMP"]

          path = Path("pyproject.toml")
          text = path.read_text()

          match = re.search(r'(?m)^version = "(\d+)\.(\d+)\.(\d+)"$', text)
          if not match:
              raise RuntimeError("Version not found")

          major, minor, patch = map(int, match.groups())

          if bump == "major":
              major += 1
              minor = 0
              patch = 0
          elif bump == "minor":
              minor += 1
              patch = 0
          else:
              patch += 1

          version = f"{major}.{minor}.{patch}"

          text = re.sub(
              r'(?m)^version = "\d+\.\d+\.\d+"$',
              f'version = "{version}"',
              text,
              count=1,
          )

          path.write_text(text)

          with open(os.environ["GITHUB_OUTPUT"], "w") as f:
              f.write(f"version={version}\n")
          EOF
        env:
          VERSION_BUMP: ${{ inputs.version_bump }}

      - name: Regenerate lock file with new version
        run: uv sync --all-extras --group dev

      - name: Commit version bump
        run: |
          git add pyproject.toml
          git add uv.lock
          git commit -m "Bump version to v${{ steps.bump.outputs.version }}"
          git push origin main

      - name: Create and push tag
        run: |
          git tag "v${{ steps.bump.outputs.version }}"
          git push origin "v${{ steps.bump.outputs.version }}"

      - name: Merge main into production
        run: |
          git fetch origin
          git checkout production
          git merge origin/main --no-ff -m "Release"
          git push origin production